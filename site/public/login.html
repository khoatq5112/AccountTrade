<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustBridge Market | Secure Login & Verification</title>
    <!-- Google Fonts: Manrope -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#137fec',
                        surface: '#f5f7fa',
                        success: '#22c55e',
                        warning: '#f59e0b',
                        error: '#ef4444'
                    },
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 20px rgba(0, 0, 0, 0.05)',
                    }
                }
            }
        }
    </script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body {
            background-color: #f5f7fa;
            color: #1a1a1a;
        }

        .input-field {
            @apply w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors;
        }

        .btn-primary {
            @apply w-full bg-primary text-white font-bold py-3 px-6 rounded-lg transition-colors duration-200 hover:bg-blue-600;
        }

        .btn-outline {
            @apply w-full border border-gray-200 text-gray-700 font-bold py-3 px-6 rounded-lg transition-colors duration-200 hover:bg-gray-50 flex items-center justify-center gap-2;
        }
    </style>
</head>

<body class="font-sans antialiased min-h-screen flex flex-col">
    <!-- Minimal Header -->
    <header class="bg-white border-b border-gray-100 py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <i class="ph-fill ph-shield-check text-primary text-3xl"></i>
                <span class="font-bold text-xl tracking-tight text-gray-900">TrustBridge</span>
            </a>
            <div class="flex items-center gap-2 text-sm text-gray-500 font-bold">
                <i class="ph-fill ph-lock-key text-success"></i> Secure Connection
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full">
            <!-- Auth Card -->
            <div class="bg-white rounded-2xl shadow-soft border border-gray-100 overflow-hidden">
                <!-- Toggles -->
                <div class="flex border-b border-gray-100">
                    <button
                        class="flex-1 py-4 text-center font-bold text-primary border-b-2 border-primary bg-white">Log
                        In</button>
                    <button
                        class="flex-1 py-4 text-center font-bold text-gray-500 hover:text-gray-700 bg-gray-50">Register
                        / KYC</button>
                </div>

                <!-- Login Form -->
                <div class="p-8">
                    <div class="text-center mb-8">
                        <h2 class="text-2xl font-bold text-gray-900 mb-2">Welcome Back</h2>
                        <p class="text-gray-500 text-sm">Enter your credentials to access your dashboard</p>
                    </div>

                    <form class="space-y-5">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-1">Email Address</label>
                            <input type="email" class="input-field" placeholder="you@example.com" required>
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="block text-sm font-bold text-gray-700">Password</label>
                                <a href="#" class="text-xs font-bold text-primary hover:text-blue-700">Forgot
                                    Password?</a>
                            </div>
                            <div class="relative">
                                <input type="password" class="input-field pr-10" placeholder="••••••••" required>
                                <button type="button"
                                    class="absolute right-3 top-3.5 text-gray-400 hover:text-gray-600">
                                    <i class="ph ph-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox"
                                class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                            <label for="remember-me" class="ml-2 block text-sm text-gray-700">Remember me</label>
                        </div>

                        <button type="button" class="btn-primary mt-6">Secure Login</button>
                    </form>

                    <div class="mt-6 border-t border-gray-100 pt-6">
                        <button class="btn-outline">
                            <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5"
                                alt="Google">
                            Continue with Google
                        </button>
                    </div>
                </div>
            </div>

            <p class="text-center text-sm text-gray-500 mt-6">
                Don't have an account? <a href="#" class="font-bold text-primary hover:underline">Register & Verify</a>
            </p>
        </div>
    </main>

    <!-- Minimal Footer -->
    <footer class="bg-white border-t border-gray-100 py-6">
        <div
            class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center text-sm text-gray-500">
            <p>&copy; 2026 TrustBridge Market. All rights reserved.</p>
            <div class="flex gap-4 mt-4 sm:mt-0">
                <a href="#" class="hover:text-gray-900 transition-colors">Terms of Service</a>
                <a href="#" class="hover:text-gray-900 transition-colors">Privacy Policy</a>
            </div>
        </div>
    </footer>
</body>

</html>
