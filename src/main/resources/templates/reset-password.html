<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrustBridge Market | Đặt lại mật khẩu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#137fec',
                        surface: '#f5f7fa',
                        success: '#22c55e',
                        error: '#ef4444'
                    },
                    fontFamily: { sans: ['Manrope', 'sans-serif'] },
                    boxShadow: { soft: '0 4px 20px rgba(0, 0, 0, 0.05)' }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>

<body class="font-sans antialiased min-h-screen flex flex-col" style="background-color:#f5f7fa;color:#1a1a1a;">
    <header class="bg-white border-b border-gray-100 py-4">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <a href="/index.html" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                <i class="ph-fill ph-shield-check text-primary text-3xl"></i>
                <span class="font-bold text-xl tracking-tight text-gray-900">TrustBridge</span>
            </a>
            <div class="flex items-center gap-2 text-sm text-gray-500 font-bold">
                <i class="ph-fill ph-lock-key text-success"></i> Kết nối bảo mật
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center py-12 px-4">
        <div class="max-w-md w-full">
            <div class="bg-white rounded-2xl shadow-soft border border-gray-100 p-8">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 mx-auto rounded-full bg-blue-50 flex items-center justify-center mb-4">
                        <i class="ph-fill ph-key text-primary text-3xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-900 mb-2">Đặt lại mật khẩu</h1>
                    <p class="text-gray-500 text-sm">Nhập mã OTP đã được gửi đến email của bạn và mật khẩu mới.</p>
                </div>

                <!-- Error message -->
                <div th:if="${param.error}"
                    class="mb-6 p-3 rounded-lg bg-red-50 text-error text-sm text-center border border-red-200"
                    th:text="${param.error}">
                </div>

                <form action="/reset-password" method="POST" class="space-y-5" onsubmit="return validateReset(event)">
                    <input type="hidden" name="email" th:value="${email != null ? email : param.email}">

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Mã OTP</label>
                        <input type="text" name="otp" required maxlength="6"
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors text-center tracking-widest text-xl font-mono"
                            placeholder="• • • • • •">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Mật khẩu mới</label>
                        <input type="password" name="newPassword" id="newPassword" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                            placeholder="••••••••">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Xác nhận mật khẩu mới</label>
                        <input type="password" name="confirmPassword" id="confirmPassword" required
                            class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors"
                            placeholder="••••••••">
                    </div>

                    <button type="submit"
                        class="w-full bg-primary text-white font-bold py-3 px-6 rounded-lg hover:bg-blue-600 transition-colors">
                        Đặt lại mật khẩu
                    </button>
                </form>

                <p class="text-center text-sm text-gray-500 mt-6">
                    Chưa nhận được mã? <a href="/forgot-password" class="font-bold text-primary hover:underline">Gửi
                        lại</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-100 py-6">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500">
            <p>&copy; 2026 TrustBridge Market. Bản quyền được bảo hộ.</p>
        </div>
    </footer>

    <script>
        function validateReset(event) {
            const newPwd = document.getElementById('newPassword').value;
            const confirmPwd = document.getElementById('confirmPassword').value;
            if (newPwd.length < 6) {
                alert('Mật khẩu phải có ít nhất 6 ký tự!');
                event.preventDefault();
                return false;
            }
            if (newPwd !== confirmPwd) {
                alert('Mật khẩu xác nhận không khớp!');
                event.preventDefault();
                return false;
            }
            return true;
        }
    </script>
</body>

</html>
