<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<aside th:fragment="sidebar(sellerUsername, sellerBadgeText, activeSellerNav)"
       th:with="
            usernameValue=${sellerUsername != null and !#strings.isEmpty(sellerUsername) ? sellerUsername : (#authentication != null ? #authentication.name : 'Seller')},
            initialsLength=${#strings.length(usernameValue) >= 2 ? 2 : #strings.length(usernameValue)},
            sellerInitials=${#strings.toUpperCase(#strings.substring(usernameValue, 0, initialsLength))}
       "
       class="w-full md:w-64 flex-shrink-0">
    <div class="bg-white rounded-xl shadow-soft border border-gray-100 overflow-hidden sticky top-28">
        <div class="p-6 border-b border-gray-100 text-center">
            <div class="relative inline-block">
                <div class="w-20 h-20 mx-auto rounded-full bg-primary text-white flex items-center justify-center font-bold text-2xl mb-3 shadow-md">
                    <span th:text="${sellerInitials}">SE</span>
                </div>
                <div class="absolute bottom-3 right-0 w-4 h-4 bg-success border-2 border-white rounded-full"></div>
            </div>
            <h2 class="font-bold text-lg text-gray-900" th:text="${usernameValue}">sellerAccount</h2>
            <div class="flex items-center justify-center gap-1 text-sm text-success mt-1">
                <i class="ph-fill ph-check-circle"></i>
                <span th:text="${sellerBadgeText != null and !#strings.isEmpty(sellerBadgeText) ? sellerBadgeText : 'Đã xác minh cấp 2'}">Đã xác minh cấp 2</span>
            </div>
        </div>
        <nav class="p-4 space-y-1">
            <a th:href="@{/seller/dashboard}"
               class="flex items-center gap-3 px-4 py-3 font-bold rounded-lg transition-colors"
               th:classappend="${activeSellerNav == 'dashboard'} ? ' bg-blue-50 text-primary' : ' text-gray-600 hover:bg-gray-50 hover:text-gray-900'">
                <i class="text-lg" th:classappend="${activeSellerNav == 'dashboard'} ? 'ph-fill ph-squares-four' : 'ph ph-squares-four'"></i> Tổng quan
            </a>
            <a th:href="@{/seller/posts}"
               class="flex items-center gap-3 px-4 py-3 font-bold rounded-lg transition-colors"
               th:classappend="${activeSellerNav == 'posts'} ? ' bg-blue-50 text-primary' : ' text-gray-600 hover:bg-gray-50 hover:text-gray-900'">
                <i class="text-lg" th:classappend="${activeSellerNav == 'posts'} ? 'ph-fill ph-package' : 'ph ph-package'"></i> Quản lý bài đăng
            </a>
            <a th:href="@{/seller/posts/new}"
               class="flex items-center gap-3 px-4 py-3 font-bold rounded-lg transition-colors"
               th:classappend="${activeSellerNav == 'new-post'} ? ' bg-blue-50 text-primary' : ' text-gray-600 hover:bg-gray-50 hover:text-gray-900'">
                <i class="text-lg" th:classappend="${activeSellerNav == 'new-post'} ? 'ph-fill ph-plus-circle' : 'ph ph-plus-circle'"></i> Đăng bài mới
            </a>
            <a href="#"
               class="flex items-center gap-3 px-4 py-3 font-bold rounded-lg transition-colors"
               th:classappend="${activeSellerNav == 'orders'} ? ' bg-blue-50 text-primary' : ' text-gray-600 hover:bg-gray-50 hover:text-gray-900'">
                <i class="text-lg" th:classappend="${activeSellerNav == 'orders'} ? 'ph-fill ph-shopping-bag' : 'ph ph-shopping-bag'"></i> Đơn hàng đang bán
            </a>
            <a href="#"
               class="flex items-center gap-3 px-4 py-3 font-bold rounded-lg transition-colors"
               th:classappend="${activeSellerNav == 'history'} ? ' bg-blue-50 text-primary' : ' text-gray-600 hover:bg-gray-50 hover:text-gray-900'">
                <i class="text-lg" th:classappend="${activeSellerNav == 'history'} ? 'ph-fill ph-clock-counter-clockwise' : 'ph ph-clock-counter-clockwise'"></i> Lịch sử bán hàng
            </a>
            <a th:href="@{/wallet}"
               class="flex items-center gap-3 px-4 py-3 font-bold rounded-lg transition-colors"
               th:classappend="${activeSellerNav == 'wallet'} ? ' bg-blue-50 text-primary' : ' text-gray-600 hover:bg-gray-50 hover:text-gray-900'">
                <i class="text-lg" th:classappend="${activeSellerNav == 'wallet'} ? 'ph-fill ph-wallet' : 'ph ph-wallet'"></i> Doanh thu & Rút tiền
            </a>
            <a href="#"
               class="flex items-center gap-3 px-4 py-3 font-bold rounded-lg transition-colors"
               th:classappend="${activeSellerNav == 'settings'} ? ' bg-blue-50 text-primary' : ' text-gray-600 hover:bg-gray-50 hover:text-gray-900'">
                <i class="text-lg" th:classappend="${activeSellerNav == 'settings'} ? 'ph-fill ph-gear' : 'ph ph-gear'"></i> Cài đặt gian hàng
            </a>
            <a href="#"
               class="flex items-center gap-3 px-4 py-3 font-bold rounded-lg transition-colors mt-6 border border-transparent"
               th:classappend="${activeSellerNav == 'complaints'} ? ' bg-red-50 text-error border-red-100' : ' text-error hover:bg-red-50 hover:border-red-100'">
                <i class="text-lg" th:classappend="${activeSellerNav == 'complaints'} ? 'ph-fill ph-warning-circle' : 'ph ph-warning-circle'"></i> Trung tâm khiếu nại
            </a>
        </nav>
    </div>
</aside>
</body>
</html>
